<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Original illustration created by Warren Lucero for this project:
       an HMI and two PLCs behind an MT6D gateway with rotating IPv6 addresses. -->
  <title>SCADA network protected by MT6D</title>
  <rect width="240" height="160" rx="10" fill="#e3effb"/>
  <line x1="120" y1="58" x2="48" y2="118" stroke="#1f3a5c" stroke-width="2"/>
  <line x1="120" y1="58" x2="120" y2="118" stroke="#1f3a5c" stroke-width="2"/>
  <line x1="120" y1="58" x2="192" y2="118" stroke="#1f3a5c" stroke-width="2"/>
  <circle cx="120" cy="40" r="22" fill="#1f3a5c" stroke="#f2a900" stroke-width="3"/>
  <text x="120" y="45" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">MT6D</text>
  <rect x="24" y="108" width="48" height="32" rx="4" fill="#ffffff" stroke="#1f3a5c" stroke-width="2"/>
  <text x="48" y="129" font-size="12" font-weight="700" fill="#13233a" text-anchor="middle">HMI</text>
  <rect x="96" y="108" width="48" height="32" rx="4" fill="#ffffff" stroke="#1f3a5c" stroke-width="2"/>
  <text x="120" y="129" font-size="12" font-weight="700" fill="#13233a" text-anchor="middle">PLC</text>
  <rect x="168" y="108" width="48" height="32" rx="4" fill="#ffffff" stroke="#1f3a5c" stroke-width="2"/>
  <text x="192" y="129" font-size="12" font-weight="700" fill="#13233a" text-anchor="middle">RTU</text>
  <path d="M156 22 A40 40 0 0 1 162 60" fill="none" stroke="#0b6e99" stroke-width="2.5" stroke-dasharray="4 3"/>
  <path d="M84 60 A40 40 0 0 1 84 22" fill="none" stroke="#0b6e99" stroke-width="2.5" stroke-dasharray="4 3"/>
</svg>
